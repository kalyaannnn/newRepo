[project]
name = "walltown"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
walltown = "walltown:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
